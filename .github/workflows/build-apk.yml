name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project (if uploaded as SDKMusic-1.zip)
        run: |
          if [ -f SDKMusic-1.zip ]; then
            unzip -o SDKMusic-1.zip -d .
          fi

      - name: Build debug APK
        working-directory: SDKMusic
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-music-debug-apk
          path: SDKMusic/app/build/outputs/apk/debug/app-debug.apk
