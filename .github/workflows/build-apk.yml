name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Android project found in repository root."
          elif [ -f "SDKMusic/settings.gradle.kts" ] || [ -f "SDKMusic/settings.gradle" ]; then
            echo "PROJECT_DIR=SDKMusic" >> "$GITHUB_ENV"
            echo "Android project found in SDKMusic/."
          else
            echo "ERROR: Android project not found."
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building from: $(pwd)"

          gradle wrapper --gradle-version 8.7

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-music-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
