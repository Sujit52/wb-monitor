name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -o IpCycler-project.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle.kts | head -1)")
          echo "PROJ_DIR=$D" >> $GITHUB_ENV
      - name: Build debug APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IpCycler-apk
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk
