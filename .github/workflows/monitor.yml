name: Website Monitor

on:
  schedule:
    - cron: '0 * * * *'   # Har 30 minute mein run hoga
  workflow_dispatch:           # Manual run bhi kar sakte ho GitHub se

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: write          # website_state.json commit karne ke liye

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python website_monitor.py

      - name: Save state (website_state.json commit karo)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website_state.json
          git diff --staged --quiet || git commit -m "chore: update website state [skip ci]"
          git push
          
